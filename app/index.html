<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Sans cette ligne, un téléphone rend la page sur une fenêtre virtuelle de
     980 px puis la dézoome : les boutons deviennent illisibles et la cible de
     dépôt inatteignable. C'est la contrepartie de la prise en charge du
     sélecteur de fichier — le livrable s'ouvre aussi sur mobile. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interface Map</title>
<style>
  :root {
    --ground: #f5f7fa;
    --surface: #ffffff;
    --ink: #14181f;
    /* Pas un gris pâle : #5b6472 tenait le seuil (5,98:1) sans être
       confortable pour autant. L'ardoise donne 10,16:1. */
    --ink-muted: #39424f;
    --accent: #2a78d6;
    --accent-ink: #ffffff;
    --line: #dde1e7;
    --critical: #d03b3b;
    --ok: #1a7f43;
    --warn: #b8860b;
    /* Encre sombre sur l'ocre clair : le blanc tombait à 3,25:1 en 11 px. */
    --warn-ink: #14181f;
    /* Les actions ont leur propre teinte : réutiliser l'accent les faisait
       ressembler à la vue sélectionnée. */
    --action: #6b4ec4;
    --action-ink: #ffffff;
    --paper: #ffffff;
    /* Teinte de hover : l'accent posé très légèrement, pour marquer une ligne
       sans écraser les couleurs de technologie qu'elle contient. */
    --accent-faible: #e4eefb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #10131a;
      --surface: #171b23;
      --ink: #eef1f6;
      --ink-muted: #b7c0cf;
      --accent: #5b9ce8;
      --accent-ink: #0b0e14;
      --line: #2a3040;
      --critical: #e6716f;
      --ok: #4cc07d;
      --warn: #e0a83c;
      --warn-ink: #14181f;
      --action: #b09bf5;
      --action-ink: #14181f;
      --accent-faible: #1e2a3d;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  .banner {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .banner-title { font-weight: 700; font-size: 16px; }
  .banner-state { flex: 1; color: var(--ink-muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .banner-error { color: var(--critical); font-weight: 600; }
  /* Le verdict du dernier référentiel déposé, à côté du fichier qu'il juge.
     À jour : une ligne discrète. Dérivé : la même ligne porte le bouton qui
     rend le classeur reconstruit — l'écran le montre déjà, le disque non. */
  .banner-referential {
    display: flex; align-items: center; gap: 10px;
    color: var(--ink-muted); font-size: 13px;
  }
  .banner-referential-drifted { color: var(--ink); font-weight: 600; }
  /* L'annonce d'une copie reconstruite : au centre de l'écran, par-dessus la
     vue, le temps d'être lue. La bannière ne garde ensuite que le bouton. */
  .refresh-panel { text-align: center; width: min(560px, 100%); }
  .refresh-panel .drop-target-actions { margin-top: 16px; }
  .export-button {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  .export-button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .export-button:disabled { opacity: 0.4; cursor: not-allowed; }
  .export-button:focus-visible, .rail-view-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Le menu « Export » : les sept formats qui ne sont pas des images, sous un
     seul bouton. Un <details> : ouvert ou fermé est l'affaire du navigateur ;
     la liste se déploie sous lui, alignée à droite, par-dessus la vue. */
  .banner-menu { position: relative; }
  .banner-menu-summary { display: inline-block; list-style: none; user-select: none; }
  .banner-menu-summary::-webkit-details-marker { display: none; }
  .banner-menu-summary::marker { content: ""; }
  .banner-menu[open] > .banner-menu-summary { border-color: var(--accent); color: var(--accent); }
  .banner-menu-disabled > .banner-menu-summary { opacity: 0.4; cursor: not-allowed; }
  .banner-menu-disabled > .banner-menu-summary:hover { border-color: var(--line); color: var(--ink); }
  .banner-menu-list {
    position: absolute; right: 0; top: calc(100% + 4px); z-index: 55;
    display: flex; flex-direction: column; min-width: 160px; padding: 4px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
  }
  .banner-menu-item {
    border: 0; background: none; color: var(--ink); text-align: left;
    padding: 7px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; white-space: nowrap;
  }
  .banner-menu-item:hover:not(:disabled) { background: var(--ground); color: var(--accent); }
  .banner-menu-item:disabled { opacity: 0.4; cursor: not-allowed; }
  .banner-menu-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .layout { flex: 1; display: flex; min-height: 0; }
  .rail {
    width: 220px; flex-shrink: 0; border-right: 1px solid var(--line);
    padding: 12px; overflow-y: auto; background: var(--surface);
    display: flex; flex-direction: column; gap: 16px;
  }
  .rail-views { flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .rail-view-item {
    text-align: left; border: none; background: none; color: var(--ink);
    padding: 8px 10px; border-radius: 4px; cursor: pointer; font-size: 13px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .rail-view-item:hover { background: var(--ground); }
  .rail-view-item[aria-current="true"] { background: var(--accent); color: var(--accent-ink); }
  /* Une pastille ronde, pas une étiquette : min-width = height donne un cercle
     à un chiffre, et la forme s'allonge d'elle-même au-delà. */
  .count-anomalies, .count-actions, .count-warnings {
    border-radius: 999px; font-size: 11px; line-height: 1;
    min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box;
    display: inline-flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums; margin-left: 4px;
  }
  .count-anomalies { background: var(--critical); color: #ffffff; }
  .count-warnings { background: var(--warn); color: var(--warn-ink); }
  .count-actions { background: var(--action); color: var(--action-ink); }
  .section-warning .section-icon { color: var(--warn); }
  .section-warning { border-color: var(--warn); }
  /* L'action se distingue de l'alerte : c'est du travail, pas un défaut. */
  .section-action .section-icon { color: var(--action); }
  .section-action { border-color: var(--action); }
  .rail-select {
    width: 100%; padding: 6px; border: 1px solid var(--line); border-radius: 4px;
    background: var(--surface); color: var(--ink);
  }
  /* Un champ de recherche à la place d'une liste déroulante de N acteurs : au
     delà d'une vingtaine, une liste ne se parcourt plus. */
  /* Le classeur comparé prend la place du sélecteur « Compared to » : les deux
     répondent à la même question, et on n'en pose qu'une à la fois. */
  .rail-compare-chosen {
    display: flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); border-radius: 4px; padding: 5px 6px;
  }
  .rail-compare-name {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 13px;
  }
  .rail-compare-drop {
    border: none; background: none; color: var(--ink-muted); cursor: pointer;
    font-size: 15px; line-height: 1; padding: 0 4px; flex-shrink: 0;
  }
  .rail-compare-drop:hover { color: var(--critical); }
  .rail-compare-file { width: 100%; font-size: 12px; }
  .rail-note { margin: 0; font-size: 11px; opacity: 0.85; }
  .rail-search-block { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .rail-search {
    width: 100%; padding: 6px; border: 1px solid var(--line); border-radius: 4px;
    background: var(--surface); color: var(--ink); box-sizing: border-box;
  }
  .rail-search:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* La liste défile plutôt que de pousser le reste du rail hors de l'écran :
     les filtres et le pied de rail restent atteignables. */
  .rail-suggestions {
    max-height: 220px; overflow-y: auto; flex-shrink: 0;
    display: flex; flex-direction: column; gap: 2px;
  }
  .rail-suggestion {
    text-align: left; border: none; background: none; color: var(--ink);
    padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 13px;
  }
  .rail-suggestion:hover { background: var(--ground); }
  .rail-suggestion[aria-current="true"] { background: var(--accent); color: var(--accent-ink); }
  .rail-suggestion:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .rail-options {
    border: none; padding: 0 0 16px 0; margin: 0; border-bottom: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 6px; font-size: 13px;
  }
  /* Le modèle se distingue des exports : il ne dépend pas d'un fichier chargé. */
  /* Le seul bouton qui produit un classeur complété : il se distingue des
     exports, qui ne font que sortir ce qui est à l'écran. */
  .generate-button { border-color: var(--accent); color: var(--accent); }
  .drop-target .export-button { margin-top: 20px; }
  /* Poussés en pied de rail : ce sont des points de départ, pas des vues. */
  .rail-starts {
    margin: auto 0 0 0; padding-top: 16px; flex-shrink: 0;
    display: flex; flex-direction: column; gap: 6px;
    border-top: 1px solid var(--line);
  }
  .rail-button {
    text-align: left; padding: 7px 10px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 4px;
    background: var(--surface); color: var(--ink-muted);
  }
  .rail-button:hover { color: var(--ink); border-color: var(--accent); }
  /* Fenêtre de migration : elle recouvre l'outil parce qu'on n'y fait qu'une
     chose, et qu'on en ressort tout de suite. */
  .migration-overlay {
    /* Au-dessus du tiroir mobile (40) et de son bouton flottant (50) : sous
       eux, le premier appui sur « Repair » semblait ne rien faire. */
    position: fixed; inset: 0; z-index: 60;
    background: rgba(0, 0, 0, 0.55);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .migration-box {
    position: relative; background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 24px; width: min(680px, 100%); max-height: 90vh; overflow-y: auto;
  }
  .migration-title { margin: 0 0 16px 0; font-size: 16px; }
  .close-button {
    position: absolute; top: 10px; right: 12px;
    border: none; background: none; color: var(--ink-muted);
    font-size: 22px; line-height: 1; cursor: pointer; padding: 4px 8px;
  }
  .close-button:hover { color: var(--ink); }
  .migration-target { min-height: 220px; }
  /* Où l'on OBTIENT un référentiel : le fichier vierge ou l'exemple. Le bloc
     est au-dessus de la cible de dépôt parce que c'est la question qu'on se
     pose avant de déposer — le référentiel se dépose ensuite à côté du
     classeur, ici ou sur l'écran principal. */
  .migration-referential-block {
    display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px;
  }
  .migration-referential-label {
    margin: 0; font-size: 12px; font-weight: 600; color: var(--ink-muted);
  }
  .migration-referential-files { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
  .migration-list {
    text-align: left; max-width: 560px; margin: 12px auto 0; font-size: 13px;
    color: var(--ink-muted); display: flex; flex-direction: column; gap: 6px;
  }
  .file-field { margin-top: 14px; font-size: 13px; color: var(--ink-muted); }
  .error-message { color: var(--critical); }
  .rail-copyright {
    margin: 0; padding-top: 4px; flex-shrink: 0;
    font-size: 11px; color: var(--ink-muted);
  }
  /* Le palier n'est pas une option d'affichage : il vaut pour l'outil entier.
     Il se pose donc au-dessus des filtres, séparé d'eux, juste sous les vues. */
  .rail-milestones {
    flex-shrink: 0; display: flex; flex-direction: column; gap: 8px;
    padding-bottom: 12px; border-bottom: 1px solid var(--line);
  }
  .rail-milestone { display: flex; flex-direction: column; gap: 4px; }
  .rail-milestone-title { font-size: 12px; font-weight: 600; color: var(--ink-muted); }

  /* La case « hide external ». Sa classe ne doit rien partager avec le bouton
     du tiroir mobile (.rail-toggle) : sous 720 px celui-ci devient une pastille
     fixe, et la case l'était devenue aussi. */
  .rail-externals {
    flex-shrink: 0; display: flex; align-items: center; gap: 6px; font-size: 13px;
    padding-bottom: 12px; border-bottom: 1px solid var(--line);
  }
  .rail-filter {
    border-bottom: 1px solid var(--line); padding-bottom: 12px; font-size: 13px;
    /* Le rail est une colonne flex : sans ceci, deux longues listes se
       compriment l'une l'autre jusqu'à ne plus montrer que deux lignes. */
    flex-shrink: 0;
  }
  .rail-filter > summary {
    cursor: pointer; font-weight: 600; padding: 4px 0; list-style-position: inside;
  }
  .rail-filter > label {
    display: flex; align-items: center; gap: 6px; padding: 3px 0 3px 8px;
    /* Une longue liste d'acteurs ne doit pas repousser le schéma hors de vue. */
    overflow-wrap: anywhere;
  }
  .rail-filter[open] { max-height: 240px; overflow-y: auto; }
  .rail-legend { list-style: none; padding: 0; margin: 0; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
  .rail-legend li { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex-shrink: 0; }

  .render-area {
    flex: 1; overflow: auto; padding: 16px;
    background-color: var(--ground);
    background-image: radial-gradient(circle, var(--line) 1px, transparent 1px);
    background-size: 20px 20px;
  }
  /* Le schéma s'affiche à SA taille, et la zone défile. L'avoir étiré à la
     largeur de la fenêtre a été essayé et mesuré : sur le classeur d'exemple,
     une planche de 2282 px dans un volet de 1141 px tombe à 0,5x, ce qui
     ramène la légende à 5 px, les noms de boîtes à 8 px et les étiquettes à
     5 px. Tout était visible, et plus rien n'était lisible.
     « Fit » reste à un clic, pour qui veut la vue d'ensemble. */
  .render-area > svg { display: block; }
  /* Les marges du tableau : présentes, mais en retrait. Ce sont des repères,
     pas de la donnée. */
  table.matrix caption {
    caption-side: top; text-align: left; padding: 0 0 8px;
    font-weight: 600; color: var(--ink);
  }
  table.matrix .matrix-total { color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  table.matrix tfoot .matrix-total { border-top: 2px solid var(--line); }
  .scale-hint {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 10px; padding: 8px 12px; font-size: 13px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  }
  .scale-hint button {
    font: inherit; padding: 2px 10px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px; background: var(--ground); color: var(--ink);
  }
  .zoom-controls { display: flex; gap: 6px; margin-top: 8px; }
  .zoom-controls button {
    font: inherit; padding: 2px 10px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface); color: var(--ink);
  }
  .drop-target {
    border: 2px dashed var(--line); border-radius: 8px; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: var(--ink-muted); gap: 8px;
  }
  #app.hover .drop-target { border-color: var(--accent); background: var(--surface); }
  .drop-target-title { font-size: 16px; font-weight: 600; color: var(--ink); }

  .no-flow { color: var(--ink-muted); font-style: italic; }

  table.matrix { border-collapse: separate; border-spacing: 0; font-size: 13px; background: var(--surface); }
  table.matrix th, table.matrix td {
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    padding: 6px 8px; vertical-align: top;
  }
  /* Les noms de destinataires à la verticale : cinquante colonnes de noms
     horizontaux font une table trois fois trop large pour être suivie.
     Empilement : coin au-dessus des deux en-têtes, eux-mêmes au-dessus des
     cases, sinon le tableau défile PAR-DESSUS ses propres en-têtes. */
  table.matrix thead th {
    background: var(--surface); position: sticky; top: 0; z-index: 3;
    text-align: center; vertical-align: bottom; padding: 8px 4px;
    border-bottom: 2px solid var(--line);
  }
  .matrix-header {
    display: inline-block; writing-mode: vertical-rl; transform: rotate(180deg);
    white-space: nowrap; font-weight: 600;
  }
  /* Un en-tête de ligne doit rester lisible quand on fait défiler vers la
     droite : c'est la moitié de la coordonnée d'une case. */
  table.matrix tbody th.matrix-actor {
    position: sticky; left: 0; z-index: 2; background: var(--surface);
    text-align: center; vertical-align: middle; white-space: nowrap; font-weight: 600;
    border-right: 2px solid var(--line);
  }
  table.matrix th.matrix-corner {
    position: sticky; left: 0; top: 0; z-index: 4;
    background: var(--surface);
    vertical-align: middle; text-align: center; white-space: nowrap;
    color: var(--ink-muted); font-weight: 500;
    border-right: 2px solid var(--line);
  }
  table.matrix tbody tr:nth-child(even) td { background: var(--ground); }
  /* Repérage de la case sous le curseur : la ligne entière s'éclaire, sinon
     l'œil perd sa coordonnée au milieu d'une grille aussi creuse. */
  table.matrix tbody tr:hover td,
  table.matrix tbody tr:hover th.matrix-actor { background: var(--accent-faible); }
  .matrix-tech {
    display: block; font-weight: 600; font-variant-numeric: tabular-nums;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
  }
  /* La couleur de la technologie tient dans la pastille ; le libellé garde
     l'encre du thème, sans quoi une couleur de référentiel réglée pour le
     papier deviendrait illisible sur fond sombre. Le liseré garde la pastille
     visible même quand sa teinte frôle celle du fond. */
  .matrix-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px; vertical-align: baseline;
    border: 1px solid var(--line);
  }

  .integrity-report { display: flex; flex-direction: column; gap: 20px; max-width: 800px; }
  .help-definitions { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 8px 0 0 0; }
  .help-definitions dt { font-weight: 600; }
  .help-definitions dd { margin: 0; color: var(--ink-muted); }
  .help-standalone { display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
  .drop-target-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  @media (max-width: 640px) { .help-definitions { grid-template-columns: 1fr; } .help-definitions dd { margin-bottom: 8px; } }
  .block-anomalies, .block-info { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; }
  .block-anomalies p, .block-info p { margin: 0 0 8px 0; color: var(--ink-muted); font-size: 13px; }
  .nothing-to-report { font-style: italic; color: var(--ink-muted); }
  .block-anomalies summary, .block-info summary {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    font-weight: 600; font-variant-numeric: tabular-nums; margin-bottom: 4px;
  }
  .block-anomalies summary:focus-visible, .block-info summary:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  /* Repliée, une section saine se réduit à sa seule ligne de résumé. */
  details:not([open]) > p, details:not([open]) > ul { display: none; }
  .section-icon { flex: none; }
  .section-ok .section-icon { color: var(--ok); }
  .section-alert .section-icon { color: var(--critical); }
  .section-info .section-icon { color: var(--ink-muted); }
  .section-alert { border-color: var(--critical); }

  /* Les écarts se lisent comme un relevé : une phrase qui pose la question,
     puis trois blocs, arrivées puis départs. Le signe porte l'information
     autant que la couleur -- un rouge et un vert seuls ne se distinguent pas
     pour tout le monde. */
  .changes { display: flex; flex-direction: column; gap: 16px; max-width: 900px; }
  .changes-header { margin: 0; color: var(--ink-muted); font-size: 14px; }
  .changes-block {
    border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px;
    background: var(--surface);
  }
  .changes-block > summary {
    cursor: pointer; font-weight: 600; font-variant-numeric: tabular-nums;
    list-style-position: inside;
  }
  .changes-block ul {
    list-style: none; margin: 8px 0 0 0; padding: 0;
    display: flex; flex-direction: column; gap: 4px; font-size: 14px;
  }
  .changes-block li { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .change-added li { color: var(--ok); }
  .change-removed li { color: var(--critical); }
  .changes-block .no-flow { margin: 8px 0 0 0; }

  .changes-diagram-title { margin: 0; font-size: 15px; font-weight: 600; }

  @media (prefers-reduced-motion: no-preference) {
    .export-button, .rail-view-item { transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease; }
  }

  /* --- Téléphone --------------------------------------------------------
     Trois décisions, pas un thème : le rail devient un tiroir (un volet de
     220 px laisserait 170 px au schéma), les neuf exports deviennent UNE
     rangée qui défile, et la planche devient une fenêtre — pleine largeur,
     hauteur plafonnée — qu'on explore au doigt : glisser déplace, pincer
     zoome (zoom.ts). La règle « le schéma s'affiche à SA taille » reste
     vraie au bureau ; sur un écran de 390 px elle ne montrait qu'un coin de
     boîte et condamnait le reste à un défilement aveugle. */
  .rail-toggle { display: none; }
  .banner-exports { display: contents; }
  @media (max-width: 720px) {
    .banner { flex-wrap: wrap; gap: 8px 12px; padding: 8px 10px; }
    /* Le nom du classeur tient sur SA ligne, tronqué par le milieu de rien :
       une ellipse vaut mieux que six lignes de méta au-dessus du schéma. */
    .banner-state { flex-basis: 100%; order: 3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .banner-referential { flex-basis: 100%; order: 5; flex-wrap: wrap; }
    /* Trois boutons — SVG, PNG, Export — tiennent sur la ligne sans défiler ;
       et un défilement rognerait le menu, qui se déploie hors de sa ligne. */
    .banner-exports { display: flex; gap: 8px; order: 4; flex-basis: 100%; }
    .banner-exports .export-button { flex-shrink: 0; }
    .banner-menu { margin-left: auto; }

    .rail { display: none; }
    .layout.rail-open .rail {
      display: flex; position: fixed; top: 0; left: 0; bottom: 0;
      width: min(320px, 86vw); z-index: 40;
      box-shadow: 4px 0 24px rgb(0 0 0 / 0.25);
    }
    /* Le fond derrière le tiroir : un voile cliquable, dessiné par le layout
       lui-même — le clic y retombe, et app.ts referme. */
    .layout.rail-open::before {
      content: ""; position: fixed; inset: 0; z-index: 30;
      background: rgb(0 0 0 / 0.35);
    }
    .rail-toggle {
      display: inline-flex; position: fixed; right: 14px; bottom: 14px; z-index: 50;
      border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px;
      background: var(--surface); color: var(--ink); font: inherit; font-size: 14px;
      box-shadow: 0 2px 12px rgb(0 0 0 / 0.2); cursor: pointer;
    }

    .render-area { padding: 10px; }
    .render-area > svg { width: 100%; height: auto; max-height: 72vh; }
  }

  /* --- Impression -------------------------------------------------------
     Aucune règle n'existait : la page sortait avec son rail, son banner et
     un schéma coupé. */
  @page { size: A4 landscape; margin: 10mm; }
  /* Le document imprimable est assemblé pour l'occasion, posé dans la page le
     temps de l'impression, puis retiré. Il ne se voit jamais à l'écran : c'est
     un livrable, pas une vue. */
  .print-document { display: none; }
  @media print {
    .banner, .rail, .rail-toggle, .migration-overlay, .zoom-controls, .scale-hint { display: none; }
    .render-area { overflow: visible; padding: 0; background: none; }
    /* max-height: none défait le plafond de 72vh posé sous 720 px : imprimé
       depuis une fenêtre étroite, le schéma sortait rapetissé sans raison. */
    .render-area > svg { max-width: 100%; height: auto; max-height: none; page-break-inside: avoid; }
    /* `economy`, la valeur par défaut, autorise le navigateur à « leave out
       all background images and to adjust text colors » -- donc à supprimer
       les aplats de couleur des boîtes. Les deux écritures : la propriété
       n'est Baseline que depuis mai 2025.
       Ce n'est qu'une DEMANDE, que l'utilisateur peut ignorer : raison de plus
       pour que la notation ne repose jamais sur la seule couleur. */
    .render-area { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    /* Une matrix de 143 cases tient rarement sur une page : sans cette règle,
       les suivantes sortent sans en-têtes et deviennent illisibles. */
    table.matrix thead { display: table-header-group; }
    table.matrix tr { page-break-inside: avoid; }
    /* Le papier est blanc, l'encre ne l'est pas. Les schémas portent leurs
       couleurs en clair (PAPER/INK) parce qu'un export ne suit pas le thème de
       qui l'affiche ; le texte de la page, lui, héritait encore de --ink --
       donc du blanc cassé sur un thème sombre, c'est-à-dire d'un dossier
       imprimé vide pour quiconque travaille en sombre. */
    body { background: #ffffff; color: #14181f; }
    .print-document, .print-document * { color: #14181f; }

    /* L'impression du dossier : une planche par page, le rapport en annexe.
       La page de l'application est masquée le temps de l'impression plutôt
       que quittée -- le classeur vit en mémoire, la quitter le perdrait. */
    body.printing > #app { display: none; }
    body.printing .print-document { display: block; }
    .print-page {
      page-break-inside: avoid;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    /* La dernière page ne la porte pas : avec elle, le PDF sort sur une page
       blanche finale. */
    .print-break { page-break-after: always; }
    .print-page > svg { max-width: 100%; height: auto; }
    .print-appendix h1 { font-size: 18px; margin: 0 0 8px 0; }
    /* Un titre de section ne reste pas seul en bas de page. */
    .print-appendix h2 { font-size: 14px; margin: 14px 0 4px 0; page-break-after: avoid; }
    .print-appendix ul { margin: 0; padding-left: 18px; }
    .print-appendix li { font-size: 12px; page-break-inside: avoid; }
    .print-document .print-scope { font-size: 12px; color: #39424f; margin: 0 0 12px 0; }
  }
</style>

  <div id="app"></div>
