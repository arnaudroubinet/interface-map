# Le retour automatique sur une contribution. Il ne construit pas le livrable --
# c'est le travail de release.yml -- il vérifie seulement que la branche tient
# debout : les types, les tests, et la construction qui doit aboutir.
#
# Deux workflows plutôt qu'un seul aux déclencheurs multiples : sur une pull
# request, un contrôle nommé « Release » qui ne publie rien induirait en erreur.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # La construction fait partie du contrôle : un code qui compile et passe
      # les tests peut encore casser l'assemblage du fichier unique.
      - run: npm run build
